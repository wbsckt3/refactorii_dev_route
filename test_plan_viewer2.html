<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor de Plan de Pruebas</title>
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github-dark.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/common.min.js"></script>
  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #2c3e50;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    .mermaid {
      background-color: #fff;
      padding: 1em;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      margin-bottom: 1em;
    }
  </style>
</head>
<body>
  <div id="markdown-output"></div>

  <script>
    // Inicializar Mermaid
    mermaid.initialize({ startOnLoad: true, theme: "default", securityLevel: "loose" });

    // Ejemplo de contenido con Mermaid
    const exampleMarkdown = `
## 🧪 Plan de Automatización

Aquí un diagrama de prueba con nodos 1–9.  
Los nodos **3 a 9** deben salir en azul.

\`\`\`mermaid
graph LR
    1[ Nodo 1 ] --> 2[ Nodo 2 ]
    2 --> 3[ Nodo 3 ]
    3 --> 4[ Nodo 4 ]
    4 --> 5[ Nodo 5 ]
    5 --> 6[ Nodo 6 ]
    6 --> 7[ Nodo 7 ]
    7 --> 8[ Nodo 8 ]
    8 --> 9[ Nodo 9 ]

    %% Definiciones de estilo
    classDef normal fill:#999,stroke:#333,stroke-width:1px,color:#fff;
    classDef destacado fill:#007bff,stroke:#0056b3,stroke-width:2px,color:#fff;

    %% Asignación de estilos
    class 1,2 normal;
    class 3,4,5,6,7,8,9 destacado;
\`\`\`
`;

    // Renderizar markdown
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      langPrefix: 'hljs language-',
      gfm: true,
      breaks: true
    });

    document.getElementById("markdown-output").innerHTML = marked.parse(exampleMarkdown);

    // Reprocesar Mermaid
    mermaid.init(undefined, document.querySelectorAll(".language-mermaid, .mermaid"));
  </script>
</body>
</html>
