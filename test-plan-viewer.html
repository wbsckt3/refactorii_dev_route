<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor de Plan de Automatización</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilos base -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
    }
    h1, h2, h3 {
      color: #38bdf8;
    }
    pre {
      background: #1e293b;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    code {
      font-family: "Fira Code", monospace;
    }
    .section {
      margin-bottom: 3rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 2rem;
    }
    .error {
      background: #dc2626;
      color: #fff;
      padding: 1rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="resumen"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const rutaId = params.get('rutaId');
      const userEmail = params.get('email');

      if (!rutaId || !userEmail) {
        document.getElementById('resumen').innerHTML = `
          <div class="error">⚠️ Faltan parámetros en la URL: rutaId y email son requeridos</div>
        `;
        return;
      }

      try {
        const response = await fetch(`https://www.refactorii.com/api/tenant/workflow/planeador_de_automatizacion_ISTQB/verifyExercisesInPath`, {
          method: "GET",
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': userEmail.toLowerCase().trim(),
            'x-path-id': String(rutaId)
          }
        });

        if (!response.ok) throw new Error(`Error HTTP ${response.status}`);

        const data = await response.json();
        const ruta = data?.ruta;

        if (ruta?.exercises) {
          const planData = JSON.parse(ruta.exercises);
          renderPlanData(planData);
        } else {
          document.getElementById('resumen').innerHTML = `
            <div class="error">❌ No se encontraron ejercicios válidos en la respuesta</div>
          `;
        }
      } catch (error) {
        document.getElementById('resumen').innerHTML = `
          <div class="error">❌ Error al cargar los datos: ${error.message}</div>
        `;
      }
    });

    function renderPlanData(plan) {
      const container = document.getElementById('resumen');
      container.innerHTML = '';

      // 1️⃣ Resumen Ejecutivo (Markdown a HTML)
      if (plan.resumenEjecutivo) {
        container.innerHTML += `
          <div class="section">
            ${marked.parse(plan.resumenEjecutivo)}
          </div>
        `;
      }

      // 2️⃣ Setup Local
      if (plan.setupLocal) {
        container.innerHTML += `
          <div class="section">
            <h2>⚙️ Setup Local</h2>
            ${marked.parse(plan.setupLocal.herramientasNecesarias)}

            <h3>📦 package.json</h3>
            <pre><code class="json">${JSON.stringify(plan.setupLocal.packageJson, null, 2)}</code></pre>

            <h3>💻 Script PowerShell</h3>
            <pre><code class="powershell">${plan.setupLocal.scriptPowershell}</code></pre>

            ${marked.parse(plan.setupLocal.explicacionEstructura)}
            <pre><code class="plaintext">${plan.setupLocal.arbolArchivos}</code></pre>
          </div>
        `;
      }

      // 3️⃣ Configuración Pruebas
      if (plan.configuracionPruebas) {
        container.innerHTML += `
          <div class="section">
            <h2>🛠 Configuración de Pruebas</h2>
            ${marked.parse(plan.configuracionPruebas.configuracionBackend)}
            <pre><code class="javascript">${plan.configuracionPruebas.configuracionCypress}</code></pre>
            ${marked.parse(plan.configuracionPruebas.verificacionAmbiente)}
          </div>
        `;
      }

      // 4️⃣ Ejecución de Pruebas
      if (plan.ejecucionPruebas) {
        container.innerHTML += `
          <div class="section">
            ${marked.parse(plan.ejecucionPruebas)}
          </div>
        `;
      }

      // 5️⃣ Integración CI/CD
      if (plan.integracionCI_CD) {
        container.innerHTML += `
          <div class="section">
            ${marked.parse(plan.integracionCI_CD)}
          </div>
        `;
      }

      // Aplicar highlight.js a todos los bloques de código
      document.querySelectorAll('pre code').forEach(el => {
        hljs.highlightElement(el);
      });
    }
  </script>
</body>
</html>
